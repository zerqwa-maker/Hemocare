name: Deploy HemoCare push
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'index.html'
      - 'sw.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'migrations/**'
      - '.github/workflows/deploy-push.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Initialize D1 tables
        run: npx wrangler d1 execute hemocare-db --remote --file=migrations/0001_push.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Initialize versioned push tables
        run: npx wrangler d1 execute hemocare-db --remote --file=migrations/0002_push_v2.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
